name: CI Regression & SPICE Verification

on:
  push:
    branches: [ main, "fix/*" ]
  pull_request:
    branches: [ main ]

jobs:
  unit-tests:
    name: Unit Tests (No SPICE Required)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run Unit Tests (Component Snapping, BOM, Optimization)
        run: |
          pytest tests/test_unit.py -v

  integration-tests:
    name: SPICE Integration & Monte Carlo Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Install ngspice
        run: |
          sudo apt-get update
          sudo apt-get install -y ngspice

      - name: Verify ngspice installation
        run: |
          ngspice -v

      - name: Run SPICE Integration Tests
        run: |
          pytest tests/test_integration_spice.py -v

      - name: Run Full End-to-End Pipeline
        run: |
          python scripts/test_pipeline.py
